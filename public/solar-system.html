<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>OSIRIS — Cosmic Explorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cyan:#5fd0e6;--gold:#ffb454;--bg:#05080d;--glass:rgba(5,8,13,.87);--border:rgba(95,208,230,.18);--font:'Courier New',monospace}
body{background:var(--bg);overflow:hidden;font-family:var(--font);color:#ccc}
canvas{display:block;position:fixed;inset:0}

/* ── HEADER BAR (fixes overlap bug) ── */
#header{
  position:fixed;top:0;left:0;right:0;height:46px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;z-index:30;pointer-events:none;
  background:linear-gradient(to bottom,rgba(5,8,13,.93) 55%,transparent);
}
#back-btn{
  pointer-events:auto;flex:0 0 auto;
  background:none;border:1px solid rgba(255,180,84,.38);color:var(--gold);
  font:bold 8px/1 var(--font);letter-spacing:.2em;padding:7px 12px;
  text-decoration:none;text-transform:uppercase;transition:background .2s;white-space:nowrap;
}
#back-btn:hover{background:rgba(255,180,84,.1)}
#title-badge{
  flex:1;text-align:center;font:bold 9px/1 var(--font);
  letter-spacing:.5em;color:var(--cyan);text-transform:uppercase;white-space:nowrap;
}
#header-spacer{flex:0 0 80px}

/* ── LEVEL NAVIGATOR (fixes nav bug) ── */
#level-nav{
  position:fixed;top:50px;left:50%;transform:translateX(-50%);
  display:flex;gap:3px;z-index:30;pointer-events:auto;
}
.lvl-btn{
  background:rgba(5,8,13,.78);border:1px solid rgba(95,208,230,.17);
  color:rgba(95,208,230,.42);font:7px/1 var(--font);letter-spacing:.16em;
  padding:5px 9px;cursor:pointer;transition:all .22s;text-transform:uppercase;white-space:nowrap;
}
.lvl-btn:hover{border-color:rgba(95,208,230,.42);color:rgba(95,208,230,.8);background:rgba(95,208,230,.05)}
.lvl-btn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(95,208,230,.11);box-shadow:0 0 9px rgba(95,208,230,.14)}
@media(max-width:500px){.lvl-btn{padding:4px 6px;font-size:6px;letter-spacing:.07em}}

/* ── BOTTOM CONTROLS ── */
#controls{
  position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:center;
  background:var(--glass);border:1px solid var(--border);padding:8px 15px;
  pointer-events:auto;font:7px/1 var(--font);letter-spacing:.11em;z-index:20;
}
.ctrl-label{color:rgba(95,208,230,.5);text-transform:uppercase}
#speed-slider{
  width:88px;cursor:pointer;-webkit-appearance:none;height:2px;
  background:linear-gradient(to right,var(--cyan) 33%,rgba(95,208,230,.2) 33%);outline:none;border:none;
}
#speed-slider::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;border-radius:50%;background:var(--cyan);cursor:pointer}
#speed-label{color:var(--cyan);min-width:72px}
#date-disp{color:rgba(255,255,255,.32);font-size:7px}
.ctrl-sep{color:rgba(95,208,230,.2)}
.ctrl-btn{
  background:none;border:1px solid rgba(95,208,230,.27);color:var(--cyan);
  padding:3px 8px;cursor:pointer;font:7px/1 var(--font);letter-spacing:.08em;
  transition:background .18s;
}
.ctrl-btn:hover{background:rgba(95,208,230,.06)}
#snd-btn{border-color:rgba(255,180,84,.28);color:rgba(255,180,84,.55)}
#snd-btn:hover{background:rgba(255,180,84,.05)}
#snd-btn.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 6px rgba(255,180,84,.15)}

/* ── SCALE BAR ── */
#scale-lbl{
  position:fixed;bottom:58px;left:50%;transform:translateX(-50%);
  font:7px/1 var(--font);letter-spacing:.17em;color:rgba(95,208,230,.36);
  pointer-events:none;white-space:nowrap;z-index:20;text-align:center;
}

/* ── PLANET INFO PANEL ── */
#pp{
  position:fixed;right:14px;top:50%;transform:translateY(-50%);
  background:var(--glass);border:1px solid var(--gold);padding:14px 16px;
  min-width:196px;pointer-events:auto;display:none;z-index:25;
}
@media(max-width:540px){#pp{right:8px;left:8px;top:auto;bottom:70px;transform:none;min-width:0}}
#pp h3{color:var(--gold);font:bold 10px/1 var(--font);letter-spacing:.3em;margin-bottom:10px;text-transform:uppercase}
.pp-row{display:flex;justify-content:space-between;gap:10px;margin:4px 0;font-size:7px;color:rgba(255,255,255,.42)}
.pp-val{color:var(--cyan);text-align:right;flex-shrink:0}
#pp-close{position:absolute;top:7px;right:9px;cursor:pointer;color:var(--gold);font-size:13px;background:none;border:none}

/* ── DOM LABELS (fixes overlap) ── */
#lbls{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.lbl{
  position:absolute;font:7px/1 var(--font);letter-spacing:.2em;
  color:rgba(95,208,230,.82);text-transform:uppercase;white-space:nowrap;
  transform:translate(-50%,-100%);pointer-events:none;padding-bottom:4px;
  transition:opacity .22s;text-shadow:0 0 7px rgba(95,208,230,.45);
}
.lbl::after{content:'';display:block;width:3px;height:3px;border-radius:50%;background:var(--cyan);margin:2px auto 0;box-shadow:0 0 4px var(--cyan)}
.lbl.galaxy{font-size:11px;letter-spacing:.48em;color:rgba(255,180,84,.88);text-shadow:0 0 10px rgba(255,180,84,.4)}
.lbl.galaxy::after{background:var(--gold);box-shadow:0 0 5px var(--gold)}
.lbl.you{font-size:8px;color:rgba(95,208,230,.95);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

/* ── CINEMATIC FLASH ── */
#flash{position:fixed;inset:0;pointer-events:none;z-index:50;background:rgba(5,8,13,0);transition:background .28s}
#flash.on{background:rgba(5,8,13,.7)}

/* ── LOADING ── */
#ldr{
  position:fixed;inset:0;background:var(--bg);z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  transition:opacity .7s;
}
#ldr.gone{opacity:0;pointer-events:none}
.spin{width:34px;height:34px;border:2px solid rgba(95,208,230,.12);border-top-color:var(--cyan);border-radius:50%;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#ldr p{font:8px/1 var(--font);letter-spacing:.35em;color:var(--cyan)}

/* ── TOUCH HINT ── */
#thint{position:fixed;bottom:58px;right:14px;font:7px/1.9 var(--font);letter-spacing:.07em;color:rgba(255,255,255,.14);pointer-events:none;text-align:right;z-index:20}
@media(min-width:768px){#thint{display:none}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"}}
</script>
</head>
<body>
<div id="ldr"><div class="spin"></div><p>OSIRIS COSMIC EXPLORER — LOADING…</p></div>
<canvas id="c"></canvas>
<div id="flash"></div>

<div id="header">
  <a id="back-btn" href="/">← BACK</a>
  <div id="title-badge">OSIRIS — COSMIC EXPLORER</div>
  <div id="header-spacer"></div>
</div>

<div id="level-nav">
  <button class="lvl-btn" data-level="0">⊕ EARTH</button>
  <button class="lvl-btn active" data-level="1">☀ SOLAR</button>
  <button class="lvl-btn" data-level="2">◉ GALAXY</button>
  <button class="lvl-btn" data-level="3">∞ UNIVERSE</button>
</div>

<div id="controls">
  <span class="ctrl-label">TIME</span>
  <input type="range" id="speed-slider" min="0" max="6" step="0.02" value="2.0"/>
  <span id="speed-label">10 d/s</span>
  <span class="ctrl-sep">|</span>
  <button class="ctrl-btn" id="pause-btn">⏸ PAUSE</button>
  <span class="ctrl-sep">|</span>
  <span id="date-disp">—</span>
  <span class="ctrl-sep">|</span>
  <button class="ctrl-btn" id="snd-btn">♪ SOUND</button>
</div>

<div id="pp">
  <button id="pp-close">✕</button>
  <h3 id="pp-name">PLANET</h3>
  <div class="pp-row"><span>MASS</span><span class="pp-val" id="pp-mass">—</span></div>
  <div class="pp-row"><span>DIAMETER</span><span class="pp-val" id="pp-dia">—</span></div>
  <div class="pp-row"><span>SURFACE TEMP</span><span class="pp-val" id="pp-temp">—</span></div>
  <div class="pp-row"><span>MOONS</span><span class="pp-val" id="pp-moons">—</span></div>
  <div class="pp-row"><span>ORBITAL PERIOD</span><span class="pp-val" id="pp-period">—</span></div>
  <div class="pp-row"><span>DISTANCE</span><span class="pp-val" id="pp-dist">—</span></div>
</div>

<div id="scale-lbl"></div>
<div id="lbls"></div>
<div id="thint">PINCH → ZOOM<br>DRAG → ORBIT<br>TAP → INFO</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ═══ DEVICE ══════════════════════════════════════════════════════════════════
const isMobile = innerWidth < 768 || navigator.maxTouchPoints > 1;
const DPR = Math.min(devicePixelRatio, isMobile ? 1.5 : 2);

// ═══ DATA ════════════════════════════════════════════════════════════════════
const J2000 = Date.UTC(2000,0,1,12);
const D = Math.PI/180;

const PLANETS = [
  {n:'Mercury',a:.387,e:.206,L0:252.3,inc:7.00,T:87.97,  r:.010,c:0x9c9c9c,moons:0,  period:'88 days',  info:{mass:'3.3×10²³ kg',dia:'4,879 km',  temp:'-180 to 430°C'}},
  {n:'Venus',  a:.723,e:.007,L0:181.9,inc:3.39,T:224.7,  r:.019,c:0xe8cb6b,moons:0,  period:'225 days', info:{mass:'4.9×10²⁴ kg',dia:'12,104 km', temp:'465°C avg'}},
  {n:'Earth',  a:1.00,e:.017,L0:100.5,inc:0.00,T:365.25, r:.021,c:0x1e5fa0,moons:1,  period:'365 days', info:{mass:'5.97×10²⁴ kg',dia:'12,742 km',temp:'-89 to 58°C'}},
  {n:'Mars',   a:1.52,e:.093,L0:355.5,inc:1.85,T:686.97, r:.014,c:0xb5472a,moons:2,  period:'687 days', info:{mass:'6.4×10²³ kg', dia:'6,779 km', temp:'-140 to 20°C'}},
  {n:'Jupiter',a:5.20,e:.049,L0:34.40,inc:1.30,T:4332.6, r:.076,c:0xc2956b,moons:95, period:'11.9 yrs', info:{mass:'1.9×10²⁷ kg',dia:'139,820 km',temp:'-108°C avg'},bands:1},
  {n:'Saturn', a:9.54,e:.057,L0:49.90,inc:2.49,T:10759,  r:.065,c:0xd5b983,moons:146,period:'29.5 yrs', info:{mass:'5.7×10²⁶ kg',dia:'116,460 km',temp:'-178°C avg'},rings:1},
  {n:'Uranus', a:19.2,e:.046,L0:313.2,inc:0.77,T:30688,  r:.035,c:0x7de8e8,moons:27, period:'84 yrs',   info:{mass:'8.7×10²⁵ kg',dia:'50,724 km', temp:'-224°C avg'}},
  {n:'Neptune',a:30.1,e:.010,L0:304.9,inc:1.77,T:60182,  r:.033,c:0x3f6bc8,moons:16, period:'165 yrs',  info:{mass:'1.02×10²⁶ kg',dia:'49,244 km',temp:'-218°C avg'}},
];

// Moon: parent planet index, orbit radius (visual units), period (days), sphere radius, color
const MOONS = [
  {pi:2,a:.055,T:27.3,  r:.0048,c:0xaaaaaa,n:'Moon'},
  {pi:3,a:.028,T:.319,  r:.0018,c:0x888888,n:'Phobos'},
  {pi:4,a:.175,T:1.77,  r:.0055,c:0xffcc55,n:'Io'},
  {pi:4,a:.265,T:3.55,  r:.0048,c:0xddd0b0,n:'Europa'},
  {pi:4,a:.375,T:7.16,  r:.0065,c:0x998877,n:'Ganymede'},
  {pi:4,a:.545,T:16.7,  r:.0060,c:0x665544,n:'Callisto'},
  {pi:5,a:.470,T:16.0,  r:.0062,c:0xdda855,n:'Titan'},
  {pi:7,a:.240,T:5.88,  r:.0038,c:0xaabbcc,n:'Triton'},
];

const COMET = {a:17.8,e:.967,L0:111.3,inc:162.3,T:27507};

// ═══ RENDERER / SCENE / CAMERA ════════════════════════════════════════════════
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05080d);

const cam = new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.0001,500000);
cam.position.set(0,6,14);

const ctrl = new OrbitControls(cam,renderer.domElement);
ctrl.enableDamping = true;
ctrl.dampingFactor = .055;
ctrl.minDistance = .003;
ctrl.maxDistance = 300000;
ctrl.zoomSpeed = 1.1;
ctrl.rotateSpeed = .7;

// ═══ LIGHTS ══════════════════════════════════════════════════════════════════
const sunLight = new THREE.PointLight(0xfff5e0,4,3000,0);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x080818,.55));

// ═══ HELPERS ═════════════════════════════════════════════════════════════════
function glowTex(r,g,b,sz=128){
  const cv=document.createElement('canvas'); cv.width=cv.height=sz;
  const cx=cv.getContext('2d');
  const gr=cx.createRadialGradient(sz/2,sz/2,0,sz/2,sz/2,sz/2);
  gr.addColorStop(0,`rgba(${r},${g},${b},1)`);
  gr.addColorStop(.25,`rgba(${r},${g},${b},.5)`);
  gr.addColorStop(.6,`rgba(${r},${g},${b},.1)`);
  gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
  cx.fillStyle=gr; cx.fillRect(0,0,sz,sz);
  return new THREE.CanvasTexture(cv);
}
function mkGlow(r,g,b,sc,add=true){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(r,g,b),transparent:true,depthWrite:false,blending:add?THREE.AdditiveBlending:THREE.NormalBlending}));
  s.scale.set(sc,sc,1); return s;
}
function mkOrbit(a,inc=0,col=0x1a3a4a,op=.27){
  const pts=[]; for(let i=0;i<=128;i++){const t=i/128*Math.PI*2,xi=a*Math.cos(t),zi=a*Math.sin(t),ir=inc*D;pts.push(new THREE.Vector3(xi,zi*Math.sin(ir),zi*Math.cos(ir)));}
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op}));
}
function kepler(M,e){let E=M;for(let i=0;i<12;i++)E=M+e*Math.sin(E);return E;}
function pPos(pd,t){
  const n=2*Math.PI/pd.T, E=kepler(n*t+pd.L0*D,pd.e);
  const xo=pd.a*(Math.cos(E)-pd.e), yo=pd.a*Math.sqrt(1-pd.e*pd.e)*Math.sin(E), ir=pd.inc*D;
  return new THREE.Vector3(xo,yo*Math.sin(ir),yo*Math.cos(ir));
}
function smoothstep(a,b,t){t=Math.max(0,Math.min(1,(t-a)/(b-a)));return t*t*(3-2*t);}
function lvlOp(d,fi0,fi1,fo0,fo1){if(d<fi0||d>fo1)return 0;if(d<fi1)return smoothstep(fi0,fi1,d);if(d>fo0)return 1-smoothstep(fo0,fo1,d);return 1;}
function cv2Tex(fn,w=512,h=256){const cv=document.createElement('canvas');cv.width=w;cv.height=h;fn(cv.getContext('2d'),w,h);return new THREE.CanvasTexture(cv);}
function eio(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}

// ═══ TEXTURES ════════════════════════════════════════════════════════════════
const TEX={
  earth:cv2Tex((cx,w,h)=>{
    cx.fillStyle='#1a4b8c';cx.fillRect(0,0,w,h);
    cx.fillStyle='#2d6b27';
    [[165,80,100,170],[295,50,80,135],[345,185,120,95],[180,265,60,80],[410,70,195,90],[605,90,175,100]].forEach(([x,y,rw,rh])=>{cx.beginPath();cx.ellipse(x+rw/2,y+rh/2,rw/2,rh/2,.3,0,Math.PI*2);cx.fill();});
    cx.fillStyle='rgba(210,230,255,.8)';cx.fillRect(0,0,w,28);cx.fillRect(0,h-28,w,28);
  }),
  jupiter:cv2Tex((cx,w,h)=>{
    ['#c2956b','#d4aa7a','#9a6030','#d0a870','#b87848','#c8a060','#9a5c38','#d4aa7a'].forEach((c,i,a)=>{cx.fillStyle=c;cx.fillRect(0,i*(h/a.length),w,h/a.length+1);});
    cx.fillStyle='rgba(170,55,25,.45)';cx.beginPath();cx.ellipse(w*.35,h*.46,w*.06,h*.08,0,0,Math.PI*2);cx.fill();
  }),
  saturn:cv2Tex((cx,w,h)=>{['#d8be88','#c9ac70','#d8be88','#c0a060','#d8be88'].forEach((c,i,a)=>{cx.fillStyle=c;cx.fillRect(0,i*(h/a.length),w,h/a.length+1);});}),
  rings:cv2Tex((cx,w,h)=>{
    const gr=cx.createLinearGradient(0,0,w,0);
    gr.addColorStop(0,'rgba(180,155,100,0)');gr.addColorStop(.04,'rgba(205,178,122,.68)');gr.addColorStop(.24,'rgba(218,192,138,.52)');
    gr.addColorStop(.38,'rgba(160,138,85,.22)');gr.addColorStop(.44,'rgba(205,178,122,.58)');
    gr.addColorStop(.68,'rgba(198,172,118,.42)');gr.addColorStop(.87,'rgba(188,163,108,.25)');gr.addColorStop(1,'rgba(180,155,100,0)');
    cx.fillStyle=gr;cx.fillRect(0,0,w,h);
  },256,64),
  moon:cv2Tex((cx,w,h)=>{
    cx.fillStyle='#aaaaaa';cx.fillRect(0,0,w,h);
    for(let i=0;i<14;i++){cx.fillStyle=`rgba(70,70,70,${.1+Math.random()*.22})`;cx.beginPath();cx.arc(Math.random()*w,Math.random()*h,3+Math.random()*18,0,Math.PI*2);cx.fill();}
  },128,128),
};

// ═══ STARS + NEBULA ══════════════════════════════════════════════════════════
(()=>{
  const N=isMobile?3500:6000, pos=new Float32Array(N*3), col=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const t=Math.random(),θ=Math.random()*Math.PI*2,φ=Math.acos(2*Math.random()-1),r=160000+Math.random()*80000;
    pos[i*3]=r*Math.sin(φ)*Math.cos(θ);pos[i*3+1]=r*Math.sin(φ)*Math.sin(θ);pos[i*3+2]=r*Math.cos(φ);
    col[i*3]=.65+.35*t;col[i*3+1]=.7+.27*(1-t*t);col[i*3+2]=.75+.25*(1-t);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.3,vertexColors:true,sizeAttenuation:false})));
})();
if(!isMobile){
  [{r:70,g:28,b:105,x:82000,y:32000,z:-58000,s:66000},{r:25,g:58,b:115,x:-64000,y:-18000,z:-88000,s:80000},{r:105,g:44,b:22,x:18000,y:-46000,z:112000,s:72000}].forEach(n=>{
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(n.r,n.g,n.b,256),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.055}));
    sp.position.set(n.x,n.y,n.z);sp.scale.set(n.s,n.s,1);scene.add(sp);
  });
}

// ═══ SOLAR SYSTEM GROUP ══════════════════════════════════════════════════════
const solarG=new THREE.Group(); scene.add(solarG);
const sMats=[]; // opacity-controlled

// ── Sun + animated corona
const sunMat=new THREE.MeshBasicMaterial({color:0xffdd22});
const sun=new THREE.Mesh(new THREE.SphereGeometry(.15,32,16),sunMat);
solarG.add(sun);
const SUN_GLOWS=[
  mkGlow(255,230,90,1.3), mkGlow(255,160,40,3.2), mkGlow(255,100,15,7.0), mkGlow(255,55,0,13),
];
SUN_GLOWS.forEach(g=>{solarG.add(g);sMats.push(g.material);});

// ── Planets + orbital trails + atmosphere glows
const TRAIL_N=isMobile?28:48;
const pObjs=PLANETS.map((pd)=>{
  const mat=new THREE.MeshPhongMaterial({color:pd.c,specular:0x181818,shininess:pd.n==='Earth'?28:7,transparent:true});
  if(pd.n==='Earth') mat.map=TEX.earth;
  if(pd.bands)       mat.map=TEX.jupiter;
  if(pd.rings)       mat.map=TEX.saturn;
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(pd.r,32,16),mat);
  solarG.add(mesh); sMats.push(mat);

  // Orbit ring
  const orb=mkOrbit(pd.a,pd.inc);
  solarG.add(orb); sMats.push(orb.material);

  // Orbital trail
  const tpa=new THREE.BufferAttribute(new Float32Array(TRAIL_N*3),3);
  const tgeo=new THREE.BufferGeometry(); tgeo.setAttribute('position',tpa); tgeo.setDrawRange(0,TRAIL_N);

let actx=null,dGain=null,audioOn=false;
function initAudio(){

    actx=new(window.AudioContext||window.webkitAudioContext)();
    const mg=actx.createGain(); mg.gain.value=0; mg.connect(actx.destination); dGain=mg;
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=160; lp.Q.value=2.5; lp.connect(mg);
    [[41,.38],[41.4,.38],[82,.13],[54.6,.18]].forEach(([f,v])=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type='sine';g.gain.value=v;o.connect(g);g.connect(lp);o.start();});
  }catch(e){}
}

// ═══ ANIMATION LOOP ═══════════════════════════════════════════════════════════
let lastT=performance.now(), fn=0, hidden=false;
document.addEventListener('visibilitychange',()=>{hidden=document.hidden;});
setTimeout(()=>{document.getElementById('ldr').classList.add('gone');setTimeout(()=>document.getElementById('ldr')?.remove(),750);},900);

function loop(){
  requestAnimationFrame(loop);
  if(hidden) return;
  const now=performance.now(), dt=Math.min((now-lastT)/1000,.1); lastT=now; fn++;

  // ── Simulate time
  if(!paused) simDays+=speed*dt;
  if(fn%30===0) dateLbl.textContent=new Date(J2000+simDays*86400000).toISOString().slice(0,10);

  // ── Camera fly-to (cinematic transition)
  if(flying){
    const t=Math.min((now-flyStart)/flyDur,1),e=eio(t);
    cam.position.lerpVectors(fp0,fp1,e);
    ctrl.target.lerpVectors(ft0,ft1,e);
    if(t>=1){flying=false;ctrl.enabled=true;}
  }

  const cd=cam.position.length(); // camera distance from sun

  // ── Planet positions + trail updates (every 4 frames)
  for(let i=0;i<pObjs.length;i++){
    const {pd,mesh,tmat,tpa}=pObjs[i];
    mesh.position.copy(pPos(pd,simDays));
    mesh.rotation.y+=dt*(pd.n==='Jupiter'?.55:pd.n==='Earth'?.42:.27);
    if(fn%4===0){
      for(let j=0;j<TRAIL_N;j++){const p=pPos(pd,simDays-pd.T*.28*(1-j/(TRAIL_N-1)));tpa.array[j*3]=p.x;tpa.array[j*3+1]=p.y;tpa.array[j*3+2]=p.z;}
      tpa.needsUpdate=true;
    }
  }

  // ── Moon positions (simplified circular orbits around parent planet)
  for(const {md,mesh} of mObjs){
    const parent=pObjs[md.pi].mesh, a=(simDays/md.T)*Math.PI*2;
    mesh.position.set(parent.position.x+md.a*Math.cos(a), parent.position.y+md.a*.12*Math.sin(a*1.3), parent.position.z+md.a*Math.sin(a));
  }

  // ── Comet (Halley orbit, ion+dust tails)
  const cp=pPos(COMET,simDays); cometComa.position.copy(cp);
  const ctLen=Math.min(4.5/(cp.length()+.05),3.8); // tail longer near sun
  const ionDir=cp.clone().normalize(); // anti-sun direction
  const dustDir=ionDir.clone().addScaledVector(new THREE.Vector3(0,1,0).cross(ionDir).normalize(),.28).normalize();
  for(let i=0;i<TAIL_N;i++){const f=i/(TAIL_N-1);cTailP.array[i*3]=cp.x+ionDir.x*f*ctLen;cTailP.array[i*3+1]=cp.y+ionDir.y*f*ctLen;cTailP.array[i*3+2]=cp.z+ionDir.z*f*ctLen;}
  for(let i=0;i<DTAIL_N;i++){const f=i/(DTAIL_N-1);cDustP.array[i*3]=cp.x+dustDir.x*f*ctLen*.65;cDustP.array[i*3+1]=cp.y+dustDir.y*f*ctLen*.65;cDustP.array[i*3+2]=cp.z+dustDir.z*f*ctLen*.65;}
  cTailP.needsUpdate=true; cDustP.needsUpdate=true;

  // ── Level opacities
  const sOp=lvlOp(cd,0,2,55,110), gOp=lvlOp(cd,28,65,2200,4500), uOp=lvlOp(cd,2800,5000,9e9,9e9);
  for(const m of sMats) m.opacity=sOp;
  for(const m of galMats) m.opacity=gOp;
  for(const m of uniMats) m.opacity=uOp;
  solarG.visible=sOp>.004; galG.visible=gOp>.004; uniG.visible=uOp>.004;

  // Override trail opacities for nicer look
  for(const {tmat} of pObjs) tmat.opacity=Math.min(sOp*.48,.44);
  // Override comet opacities
  cometComa.material.opacity=sOp*.78;
  cTailMat.opacity=Math.min(sOp*.62,.58);
  cDustMat.opacity=Math.min(sOp*.32,.28);

  // Universe background tint
  if(uOp>0) scene.background=new THREE.Color(0x05080d).lerp(new THREE.Color(0x060410),uOp*.7);
  else scene.background=new THREE.Color(0x05080d);

  // ── Earth close-up
  const ewp=new THREE.Vector3(); pObjs[2].mesh.getWorldPosition(ewp);
  const de=cam.position.distanceTo(ewp);
  const edOp=lvlOp(de,0,.02,.12,.22);
  if(edOp>0&&cd<3){
    edG.position.copy(ewp); edG.visible=true;
    for(const m of edMats) m.opacity=edOp;
    clouds.rotation.y+=dt*.07;
    const ia=simDays*15.54*Math.PI*2%(Math.PI*2);
    issMesh.position.set(Math.cos(ia)*.027,Math.sin(ia*7)*.0022,Math.sin(ia)*.027);
    const ma=(simDays/27.32)*Math.PI*2;
    moonDetail.position.set(Math.cos(ma)*.055,0,Math.sin(ma)*.055);
  } else edG.visible=false;

  // ── Animated sun corona
  const t=now*.001;
  SUN_GLOWS[0].scale.set(1.3*(1+Math.sin(t*.7)*.06),1.3*(1+Math.sin(t*.7)*.06),1);
  SUN_GLOWS[1].scale.set(3.2*(1+Math.sin(t*.45)*.05),3.2*(1+Math.sin(t*.45)*.05),1);
  SUN_GLOWS[2].scale.set(7.0*(1+Math.sin(t*.3)*.04),7.0*(1+Math.sin(t*.3)*.04),1);
  SUN_GLOWS[3].scale.set(13*(1+Math.sin(t*.18)*.03),13*(1+Math.sin(t*.18)*.03),1);
  sun.rotation.y+=dt*.18;

  // ── Level detection (auto-update nav if not flying)
  if(!flying){
    let lvl; if(de<.15&&cd<3)lvl=0;else if(cd<60)lvl=1;else if(cd<4000)lvl=2;else lvl=3;
    if(lvl!==curLevel) setLevel(lvl);
  }

  // ── Planet labels with collision resolution
  const lOp=Math.min(sOp,1-Math.max(0,(cd-25)/36));
  const lItems=[];
  for(let i=0;i<pObjs.length;i++){
    const p=proj(pObjs[i].mesh);
    if(p.vis&&lOp>.04) lItems.push({lbl:pLabels[i],x:p.x,y:p.y-9,op:lOp});
    else pLabels[i].style.opacity='0';
  }
  resolveOverlap(lItems);
  for(const {lbl,x,y,op} of lItems) setL(lbl,x,y,op);

  // ── Galaxy labels
  const gl=gOp>.25?gOp:0;
  galLbl.style.opacity=gl; youLbl.style.opacity=gl;
  if(gl>.01){
    const gc=new THREE.Vector3(-150,0,0).project(cam);
    setL(galLbl,(gc.x+1)/2*innerWidth,(-gc.y+1)/2*innerHeight-32,gl);
    const yp=proj(youG); if(yp.vis) setL(youLbl,yp.x,yp.y-14,gl);
  }

  // ── Universe label
  uniLbl.style.opacity=uOp; if(uOp>.01) setL(uniLbl,innerWidth/2,72,uOp);

  // ── Scale
  if(fn%10===0) updScale(cd);

  ctrl.update();
  renderer.render(scene,cam);
}
loop();

window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
