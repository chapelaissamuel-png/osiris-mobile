<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>OSIRIS — Cosmic Explorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cyan:#5fd0e6;--gold:#ffb454;--red:#ff3d3d;--bg:#05080d;--glass:rgba(5,8,13,0.82)}
body{background:var(--bg);overflow:hidden;font-family:'Courier New',monospace;color:#ccc}
canvas{display:block;position:fixed;inset:0}

/* ── HUD ── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}

#back-btn{
  position:absolute;top:18px;left:18px;pointer-events:auto;cursor:pointer;
  background:var(--glass);border:1px solid var(--gold);color:var(--gold);
  font:bold 9px/1 'Courier New',monospace;letter-spacing:.25em;padding:9px 16px;
  text-decoration:none;text-transform:uppercase;transition:background .2s;display:block;
}
#back-btn:hover{background:rgba(255,180,84,.12)}

#title-badge{
  position:absolute;top:18px;left:50%;transform:translateX(-50%);
  font:bold 10px/1 'Courier New',monospace;letter-spacing:.5em;color:var(--cyan);
  background:var(--glass);border:1px solid rgba(95,208,230,.25);padding:7px 22px;
  text-transform:uppercase;white-space:nowrap;pointer-events:none;
}

#level-badge{
  position:absolute;top:60px;left:50%;transform:translateX(-50%);
  font:9px/1 'Courier New',monospace;letter-spacing:.35em;color:#fff;
  background:rgba(95,208,230,.12);border:1px solid var(--cyan);
  padding:6px 18px;opacity:0;transition:opacity .4s;white-space:nowrap;pointer-events:none;
}
#level-badge.vis{opacity:1}

#controls{
  position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
  background:var(--glass);border:1px solid rgba(95,208,230,.18);padding:10px 20px;
  pointer-events:auto;font:8px/1 'Courier New',monospace;letter-spacing:.15em;
}
.ctrl-label{color:rgba(95,208,230,.6);text-transform:uppercase}
#speed-slider{
  width:100px;cursor:pointer;-webkit-appearance:none;height:2px;
  background:linear-gradient(to right,var(--cyan) 33%,rgba(95,208,230,.2) 33%);
  outline:none;border:none;
}
#speed-slider::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;background:var(--cyan);cursor:pointer}
#speed-label{color:var(--cyan);min-width:80px}
#date-disp{color:rgba(255,255,255,.4);font-size:8px}
.ctrl-sep{color:rgba(95,208,230,.2)}
.ctrl-btn{
  pointer-events:auto;background:none;border:1px solid rgba(95,208,230,.3);
  color:var(--cyan);padding:3px 9px;cursor:pointer;font:8px/1 'Courier New',monospace;
  letter-spacing:.1em;
}
.ctrl-btn:hover{background:rgba(95,208,230,.08)}

#scale-lbl{
  position:absolute;bottom:72px;left:50%;transform:translateX(-50%);
  font:8px/1 'Courier New',monospace;letter-spacing:.2em;color:rgba(95,208,230,.4);
  pointer-events:none;white-space:nowrap;text-align:center;
}

/* ── Planet info panel ── */
#pp{
  position:absolute;right:18px;top:50%;transform:translateY(-50%);
  background:var(--glass);border:1px solid var(--gold);padding:18px 20px;
  min-width:210px;pointer-events:auto;display:none;
}
#pp h3{color:var(--gold);font:bold 11px/1 'Courier New',monospace;letter-spacing:.35em;margin-bottom:12px}
.pp-row{display:flex;justify-content:space-between;margin:5px 0;font-size:8px;color:rgba(255,255,255,.5)}
.pp-val{color:var(--cyan)}
#pp-close{position:absolute;top:9px;right:12px;cursor:pointer;color:var(--gold);font-size:16px;line-height:1;background:none;border:none}

/* ── Loading overlay ── */
#ldr{
  position:fixed;inset:0;background:var(--bg);z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .6s;
}
#ldr.gone{opacity:0;pointer-events:none}
.spin{width:36px;height:36px;border:2px solid rgba(95,208,230,.15);border-top-color:var(--cyan);border-radius:50%;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#ldr p{font:9px/1 'Courier New',monospace;letter-spacing:.35em;color:var(--cyan);text-transform:uppercase}

/* ── Labels ── */
#lbls{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.lbl{
  position:absolute;font:7px/1 'Courier New',monospace;letter-spacing:.25em;
  color:rgba(95,208,230,.8);text-transform:uppercase;white-space:nowrap;
  transform:translate(-50%,-100%);text-shadow:0 0 6px var(--cyan);
  transition:opacity .3s;pointer-events:none;
}
.lbl.galaxy{font-size:11px;letter-spacing:.5em;color:rgba(255,180,84,.85)}
.lbl.you{font-size:8px;color:rgba(95,208,230,.95);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}

/* ── Touch hint ── */
#thint{
  position:absolute;bottom:72px;right:18px;font:7px/1.8 'Courier New',monospace;
  letter-spacing:.1em;color:rgba(255,255,255,.18);pointer-events:none;text-align:right;
}
@media(min-width:768px){#thint{display:none}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="ldr"><div class="spin"></div><p id="ldr-s">OSIRIS COSMIC EXPLORER — LOADING…</p></div>

<canvas id="c"></canvas>

<div id="hud">
  <a id="back-btn" href="/">← BACK TO OSIRIS</a>
  <div id="title-badge">OSIRIS — COSMIC EXPLORER</div>
  <div id="level-badge"></div>

  <div id="controls">
    <span class="ctrl-label">TIME</span>
    <input type="range" id="speed-slider" min="0" max="6" step="0.02" value="2.0" />
    <span id="speed-label">10 days/s</span>
    <span class="ctrl-sep">|</span>
    <button class="ctrl-btn" id="pause-btn">⏸ PAUSE</button>
    <span class="ctrl-sep">|</span>
    <span id="date-disp">—</span>
  </div>

  <div id="pp">
    <button id="pp-close">✕</button>
    <h3 id="pp-name">PLANET</h3>
    <div class="pp-row"><span>MASS</span><span class="pp-val" id="pp-mass">—</span></div>
    <div class="pp-row"><span>DIAMETER</span><span class="pp-val" id="pp-dia">—</span></div>
    <div class="pp-row"><span>TEMPERATURE</span><span class="pp-val" id="pp-temp">—</span></div>
    <div class="pp-row"><span>MOONS</span><span class="pp-val" id="pp-moons">—</span></div>
    <div class="pp-row"><span>ORBITAL PERIOD</span><span class="pp-val" id="pp-period">—</span></div>
    <div class="pp-row"><span>DISTANCE</span><span class="pp-val" id="pp-dist">—</span></div>
  </div>

  <div id="scale-lbl"></div>
  <div id="thint">PINCH → ZOOM<br>DRAG → ORBIT<br>TAP → INFO</div>
</div>
<div id="lbls"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ═══ CONSTANTS ═══════════════════════════════════════════════════════════════

const J2000_MS = Date.UTC(2000, 0, 1, 12);
const DEG = Math.PI / 180;

const PLANET_DATA = [
  { name:'Mercury', a:0.387, e:0.206, L0:252.3, inc:7.00, T:87.97,   r:0.012, col:0x9c9c9c, moons:0,  period:'88 days',   info:{mass:'3.3×10²³ kg', dia:'4,879 km',   temp:'-180 to 430°C'} },
  { name:'Venus',   a:0.723, e:0.007, L0:181.9, inc:3.39, T:224.7,   r:0.021, col:0xe3c46b, moons:0,  period:'225 days',  info:{mass:'4.9×10²⁴ kg', dia:'12,104 km',  temp:'465°C avg'} },
  { name:'Earth',   a:1.000, e:0.017, L0:100.5, inc:0.00, T:365.25,  r:0.023, col:0x1e5fa0, moons:1,  period:'365 days',  info:{mass:'5.97×10²⁴ kg',dia:'12,742 km',  temp:'-89 to 58°C'} },
  { name:'Mars',    a:1.524, e:0.093, L0:355.5, inc:1.85, T:686.97,  r:0.016, col:0xb5472a, moons:2,  period:'687 days',  info:{mass:'6.4×10²³ kg', dia:'6,779 km',   temp:'-140 to 20°C'} },
  { name:'Jupiter', a:5.203, e:0.049, L0:34.40, inc:1.30, T:4332.6,  r:0.082, col:0xc2956b, moons:95, period:'11.9 yrs',  info:{mass:'1.9×10²⁷ kg', dia:'139,820 km', temp:'-108°C avg'}, bands:true },
  { name:'Saturn',  a:9.537, e:0.057, L0:49.90, inc:2.49, T:10759,   r:0.070, col:0xd5b983, moons:146,period:'29.5 yrs',  info:{mass:'5.7×10²⁶ kg', dia:'116,460 km', temp:'-178°C avg'}, rings:true },
  { name:'Uranus',  a:19.19, e:0.046, L0:313.2, inc:0.77, T:30688,   r:0.038, col:0x7de8e8, moons:27, period:'84 yrs',    info:{mass:'8.7×10²⁵ kg', dia:'50,724 km',  temp:'-224°C avg'} },
  { name:'Neptune', a:30.07, e:0.010, L0:304.9, inc:1.77, T:60182,   r:0.036, col:0x3f6bc8, moons:16, period:'165 yrs',   info:{mass:'1.02×10²⁶ kg',dia:'49,244 km',  temp:'-218°C avg'} },
];

// ═══ SCENE ═══════════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05080d);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.0001, 400000);
camera.position.set(0, 6, 14);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance  = 0.003;
controls.maxDistance  = 280000;
controls.zoomSpeed    = 1.1;
controls.rotateSpeed  = 0.7;

// ═══ LIGHTING ════════════════════════════════════════════════════════════════

const sunLight = new THREE.PointLight(0xfff5e0, 3.5, 3000, 0);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x08081a, 0.6));

// ═══ HELPERS ═════════════════════════════════════════════════════════════════

function glowTex(r, g, b, sz=128) {
  const cv = document.createElement('canvas'); cv.width = cv.height = sz;
  const cx = cv.getContext('2d');
  const gr = cx.createRadialGradient(sz/2, sz/2, 0, sz/2, sz/2, sz/2);
  gr.addColorStop(0,    `rgba(${r},${g},${b},1)`);
  gr.addColorStop(0.25, `rgba(${r},${g},${b},.5)`);
  gr.addColorStop(0.55, `rgba(${r},${g},${b},.12)`);
  gr.addColorStop(1,    `rgba(${r},${g},${b},0)`);
  cx.fillStyle = gr; cx.fillRect(0,0,sz,sz);
  return new THREE.CanvasTexture(cv);
}

function mkGlow(r, g, b, scale, additive=true) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex(r,g,b), transparent:true, depthWrite:false,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
  }));
  s.scale.set(scale, scale, 1);
  return s;
}

function mkOrbitRing(a, inc=0, color=0x223344) {
  const pts = [];
  for (let i=0; i<=128; i++) {
    const θ = i/128 * Math.PI*2;
    const xi = a*Math.cos(θ), zi = a*Math.sin(θ);
    const inc_r = inc * DEG;
    pts.push(new THREE.Vector3(xi, zi*Math.sin(inc_r), zi*Math.cos(inc_r)));
  }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const m = new THREE.LineBasicMaterial({ color, transparent:true, opacity:0.3 });
  const l = new THREE.Line(g, m);
  return l;
}

function solveKepler(M, e) {
  let E = M;
  for (let i=0; i<12; i++) E = M + e*Math.sin(E);
  return E;
}

function planetXZ(pd, t) {
  const n = 2*Math.PI / pd.T;
  const E = solveKepler(n*t + pd.L0*DEG, pd.e);
  const xOrb = pd.a*(Math.cos(E) - pd.e);
  const yOrb = pd.a*Math.sqrt(1-pd.e*pd.e)*Math.sin(E);
  const inc = pd.inc*DEG;
  return new THREE.Vector3(xOrb, yOrb*Math.sin(inc), yOrb*Math.cos(inc));
}

function smooth(a, b, t) {
  t = Math.max(0, Math.min(1, (t-a)/(b-a)));
  return t*t*(3-2*t);
}

function levelOp(dist, fi0, fi1, fo0, fo1) {
  if (dist < fi0 || dist > fo1) return 0;
  if (dist < fi1) return smooth(fi0, fi1, dist);
  if (dist > fo0) return 1 - smooth(fo0, fo1, dist);
  return 1;
}

function canvas2DTexture(fn, w=512, h=256) {
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  fn(cv.getContext('2d'), w, h);
  return new THREE.CanvasTexture(cv);
}

// Planet procedural textures
const TEX = {
  earth: canvas2DTexture((cx,w,h) => {
    cx.fillStyle='#1a4b8c'; cx.fillRect(0,0,w,h);
    cx.fillStyle='#2d6b27';
    [[170,85,95,165],[300,55,75,130],[350,190,115,90],[185,270,55,75],[415,75,190,85],[610,95,170,95]].forEach(([x,y,rw,rh]) => {
      cx.beginPath(); cx.ellipse(x+rw/2,y+rh/2,rw/2,rh/2,Math.PI*0.1,0,Math.PI*2); cx.fill();
    });
    cx.fillStyle='rgba(210,230,255,0.85)'; cx.fillRect(0,0,w,30); cx.fillRect(0,h-30,w,30);
  }),
  jupiter: canvas2DTexture((cx,w,h) => {
    const cols=['#c2956b','#d4aa7a','#9c6b40','#d4aa7a','#b88050','#c9a065','#9a6040'];
    const bh = h/cols.length;
    cols.forEach((c,i)=>{ cx.fillStyle=c; cx.fillRect(0,i*bh,w,bh+1); });
  }),
  saturn: canvas2DTexture((cx,w,h) => {
    const cols=['#d5b983','#c5a870','#d5b983','#bfa060','#d5b983'];
    const bh = h/cols.length;
    cols.forEach((c,i)=>{ cx.fillStyle=c; cx.fillRect(0,i*bh,w,bh+1); });
  }),
};

// ═══ BACKGROUND STARS ════════════════════════════════════════════════════════

(function() {
  const N=6000; const pos=new Float32Array(N*3), col=new Float32Array(N*3);
  for (let i=0; i<N; i++) {
    const θ=Math.random()*Math.PI*2, φ=Math.acos(2*Math.random()-1);
    const r=160000+Math.random()*80000;
    pos[i*3]=r*Math.sin(φ)*Math.cos(θ); pos[i*3+1]=r*Math.sin(φ)*Math.sin(θ); pos[i*3+2]=r*Math.cos(φ);
    const t=Math.random(); col[i*3]=.7+.3*t; col[i*3+1]=.75+.25*(1-t*t); col[i*3+2]=.8+.2*(1-t);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({size:1.2,vertexColors:true,sizeAttenuation:false})));
})();

// ═══ LEVEL 1 — SOLAR SYSTEM ══════════════════════════════════════════════════

const solarGroup = new THREE.Group();
scene.add(solarGroup);
const solarMats = [];

// Sun sphere + corona glows
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd22 });
const sun = new THREE.Mesh(new THREE.SphereGeometry(0.15, 32, 16), sunMat);
const sunG1 = mkGlow(255,200,60,1.8), sunG2 = mkGlow(255,120,0,4.5), sunG3 = mkGlow(255,80,0,10);
solarGroup.add(sun, sunG1, sunG2, sunG3);
solarMats.push(sunG1.material, sunG2.material, sunG3.material);

// Planets
const planetObjs = PLANET_DATA.map(pd => {
  const mat = new THREE.MeshPhongMaterial({
    color: pd.col, specular:0x222222, shininess: pd.name==='Earth'?30:10, transparent:true,
  });
  if (pd.name==='Earth')  { mat.map = TEX.earth; }
  if (pd.bands)            { mat.map = TEX.jupiter; }
  if (pd.rings && pd.name==='Saturn') { mat.map = TEX.saturn; }

  const mesh = new THREE.Mesh(new THREE.SphereGeometry(pd.r, 32, 16), mat);
  mesh.castShadow = true;
  solarMats.push(mat);
  solarGroup.add(mesh);

  const orb = mkOrbitRing(pd.a, pd.inc);
  solarGroup.add(orb);
  solarMats.push(orb.material);

  let ringMesh = null;
  if (pd.rings) {
    const rg = new THREE.RingGeometry(pd.r*1.45, pd.r*2.6, 96);
    const rm = new THREE.MeshBasicMaterial({color:0xbea87a, transparent:true, opacity:0.55, side:THREE.DoubleSide, depthWrite:false});
    ringMesh = new THREE.Mesh(rg, rm);
    ringMesh.rotation.x = Math.PI/2.5;
    mesh.add(ringMesh);
    solarMats.push(rm);
  }

  const pglow = mkGlow((pd.col>>16)&255,(pd.col>>8)&255,pd.col&255, pd.r*9);
  mesh.add(pglow);
  solarMats.push(pglow.material);

  return { pd, mesh, ringMesh };
});

// Asteroid belt
(function(){
  const N=700; const pos=new Float32Array(N*3);
  for (let i=0; i<N; i++) {
    const r=2.2+Math.random()*1.05, θ=Math.random()*Math.PI*2, y=(Math.random()-.5)*.12;
    pos[i*3]=r*Math.cos(θ); pos[i*3+1]=y; pos[i*3+2]=r*Math.sin(θ);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const m=new THREE.PointsMaterial({color:0x666666,size:.012,sizeAttenuation:true,transparent:true});
  solarGroup.add(new THREE.Points(g,m));
  solarMats.push(m);
})();

// ═══ LEVEL 0 — EARTH CLOSE-UP ════════════════════════════════════════════════

const earthDetailGroup = new THREE.Group();
scene.add(earthDetailGroup);
earthDetailGroup.visible = false;
const earthDetailMats = [];

const edMat = new THREE.MeshPhongMaterial({ map: TEX.earth, specular:0x446688, shininess:35, transparent:true });
const earthDetail = new THREE.Mesh(new THREE.SphereGeometry(0.023, 64, 32), edMat);
earthDetailMats.push(edMat);
earthDetailGroup.add(earthDetail);

const cloudMat = new THREE.MeshPhongMaterial({ color:0xffffff, transparent:true, opacity:0.28, depthWrite:false });
const clouds = new THREE.Mesh(new THREE.SphereGeometry(0.0237, 48, 24), cloudMat);
earthDetailGroup.add(clouds);
earthDetailMats.push(cloudMat);

const atmGlow = mkGlow(80,160,255, 0.13, false);
atmGlow.material.opacity = 0.6;
earthDetailGroup.add(atmGlow);
earthDetailMats.push(atmGlow.material);

const issOrbitPts = [];
for (let i=0; i<=128; i++) {
  const θ = i/128*Math.PI*2;
  issOrbitPts.push(new THREE.Vector3(Math.cos(θ)*0.0275, Math.sin(i*.4)*.0025, Math.sin(θ)*0.0275));
}
const issOrbitMat = new THREE.LineBasicMaterial({color:0x5fd0e6, transparent:true, opacity:.5});
earthDetailGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(issOrbitPts), issOrbitMat));
earthDetailMats.push(issOrbitMat);

const issMesh = new THREE.Mesh(
  new THREE.SphereGeometry(.0003,4,4),
  new THREE.MeshBasicMaterial({color:0x5fd0e6})
);
earthDetailGroup.add(issMesh);

// ═══ LEVEL 2 — MILKY WAY ═════════════════════════════════════════════════════

// Galaxy is offset so sun (world origin) appears in a spiral arm, not at galactic center
const galaxyGroup = new THREE.Group();
galaxyGroup.position.set(-150, 0, 0); // galactic center 150 units to the left of sun
galaxyGroup.rotation.x = 0.38;
scene.add(galaxyGroup);
const galaxyMats = [];

function gauss() {
  let u,v; do u=Math.random(); while(!u); do v=Math.random(); while(!v);
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

(function buildGalaxy(){
  const N=90000; const pos=new Float32Array(N*3), col=new Float32Array(N*3);
  for (let i=0; i<N; i++) {
    let x,y,z,r,g,b;
    const t=Math.random();
    if (t < 0.12) {
      // Core — dense Gaussian bulge
      x=gauss()*22; z=gauss()*22; y=gauss()*5;
      r=1.0; g=0.88; b=0.65;
    } else {
      // 4 spiral arms (logarithmic spiral)
      const arm = Math.floor(Math.random()*4);
      const armOff = arm/4*Math.PI*2;
      const d = 15 + Math.pow(Math.random(),.75)*380;
      const θ = armOff + 0.75*Math.log(d/15);
      const scatter = (Math.random()-.5)*d*.22;
      x = d*Math.cos(θ) + scatter*Math.cos(θ+Math.PI/2);
      z = d*Math.sin(θ) + scatter*Math.sin(θ+Math.PI/2);
      y = gauss()*7*(1-d/420);
      const fade=d/400;
      r=.55+.45*(1-fade); g=.70+.25*(1-fade*fade); b=.65+.35*fade;
    }
    pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
    col[i*3]=Math.min(r,1); col[i*3+1]=Math.min(g,1); col[i*3+2]=Math.min(b,1);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const mat=new THREE.PointsMaterial({size:2.8,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
  galaxyGroup.add(new THREE.Points(geo,mat));
  galaxyMats.push(mat);
})();

// "You Are Here" — at (150,0,0) in galaxy local = world origin (where the sun is)
const youGroup = new THREE.Group();
youGroup.position.set(150, 0, 0); // sun position in galaxy
galaxyGroup.add(youGroup);
const youMesh = new THREE.Mesh(new THREE.SphereGeometry(2,8,8), new THREE.MeshBasicMaterial({color:0x5fd0e6}));
const youGlow  = mkGlow(95,208,230, 25);
youGroup.add(youMesh, youGlow);
galaxyMats.push(youGlow.material);

// Galaxy halo
const haloMat = new THREE.PointsMaterial({color:0x7060b0,size:1.5,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
galaxyMats.push(haloMat);
(function(){
  const N=4000; const pos=new Float32Array(N*3);
  for (let i=0; i<N; i++) {
    const θ=Math.random()*Math.PI*2, φ=Math.acos(2*Math.random()-1), r=250+Math.random()*300;
    pos[i*3]=r*Math.sin(φ)*Math.cos(θ); pos[i*3+1]=r*Math.sin(φ)*Math.sin(θ)*.35; pos[i*3+2]=r*Math.cos(φ);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  galaxyGroup.add(new THREE.Points(g,haloMat));
})();

// ═══ LEVEL 3 — OBSERVABLE UNIVERSE ══════════════════════════════════════════

const universeGroup = new THREE.Group();
scene.add(universeGroup);
const universeMats = [];

(function buildUniverse(){
  const CLUSTERS=90, GALAXIES=9000;
  const clusters=[];
  for (let i=0; i<CLUSTERS; i++) {
    const θ=Math.random()*Math.PI*2, φ=Math.acos(2*Math.random()-1);
    const r=3000+Math.random()*42000;
    clusters.push({x:r*Math.sin(φ)*Math.cos(θ), y:r*Math.sin(φ)*Math.sin(θ)*.25, z:r*Math.cos(φ)});
  }
  const pos=new Float32Array(GALAXIES*3), col=new Float32Array(GALAXIES*3);
  for (let i=0; i<GALAXIES; i++) {
    const cl=clusters[i%CLUSTERS|0];
    const sp=600+Math.random()*2200;
    pos[i*3]=cl.x+gauss()*sp; pos[i*3+1]=cl.y+gauss()*sp*.2; pos[i*3+2]=cl.z+gauss()*sp;
    const t=Math.random();
    if (t<.45){ col[i*3]=1; col[i*3+1]=.72; col[i*3+2]=.45; } // elliptical
    else       { col[i*3]=.55; col[i*3+1]=.8; col[i*3+2]=1; } // spiral
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const mat=new THREE.PointsMaterial({size:100,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
  universeGroup.add(new THREE.Points(geo,mat));
  universeMats.push(mat);

  // Cosmic filaments (lines between nearby clusters)
  const filPts=[];
  for (let i=0; i<CLUSTERS; i++) {
    for (let j=i+1; j<CLUSTERS; j++) {
      const dx=clusters[i].x-clusters[j].x, dy=clusters[i].y-clusters[j].y, dz=clusters[i].z-clusters[j].z;
      if (Math.sqrt(dx*dx+dy*dy+dz*dz)<12000) {
        filPts.push(new THREE.Vector3(clusters[i].x,clusters[i].y,clusters[i].z));
        filPts.push(new THREE.Vector3(clusters[j].x,clusters[j].y,clusters[j].z));
      }
    }
  }
  if (filPts.length>0) {
    const fg=new THREE.BufferGeometry().setFromPoints(filPts);
    const fm=new THREE.LineBasicMaterial({color:0x3a3060,transparent:true,opacity:.3});
    universeGroup.add(new THREE.LineSegments(fg,fm));
    universeMats.push(fm);
  }
})();

// ═══ DOM LABELS ══════════════════════════════════════════════════════════════

const lblContainer = document.getElementById('lbls');

function mkLabel(text, cls='') {
  const d=document.createElement('div'); d.className='lbl '+cls; d.textContent=text;
  d.style.opacity='0'; lblContainer.appendChild(d); return d;
}

const planetLabels  = planetObjs.map(o => mkLabel(o.pd.name.toUpperCase()));
const galaxyLabel   = mkLabel('MILKY WAY GALAXY', 'galaxy');
const youLabel      = mkLabel('YOU ARE HERE', 'you');
const universeLabel = mkLabel('OBSERVABLE UNIVERSE', 'galaxy');

// ═══ LEVEL BADGE ═════════════════════════════════════════════════════════════

const LEVELS_META = [
  'LEVEL 0 — EARTH ORBIT',
  'LEVEL 1 — SOLAR SYSTEM',
  'LEVEL 2 — MILKY WAY GALAXY',
  'LEVEL 3 — OBSERVABLE UNIVERSE',
];
let lastLvl = -1, badgeT = null;
const levelBadgeEl = document.getElementById('level-badge');

function showBadge(idx) {
  if (idx===lastLvl) return; lastLvl=idx;
  levelBadgeEl.textContent = LEVELS_META[idx];
  levelBadgeEl.classList.add('vis');
  if (badgeT) clearTimeout(badgeT);
  badgeT = setTimeout(()=>levelBadgeEl.classList.remove('vis'), 2600);
}

// ═══ TIME CONTROL ════════════════════════════════════════════════════════════

let simDays = (Date.now()-J2000_MS)/86400000;
let paused = false, speed = 10;

const sliderEl = document.getElementById('speed-slider');
const speedLbl = document.getElementById('speed-label');
const pauseBtn = document.getElementById('pause-btn');
const dateLbl  = document.getElementById('date-disp');

function fmtSpeed(s) {
  if (s===0)         return 'PAUSED';
  if (s<1)           return `${s.toFixed(2)} days/s`;
  if (s<1000)        return `${Math.round(s)} days/s`;
  if (s<365.25*1000) return `${(s/365.25).toFixed(1)} yrs/s`;
  return `${(s/365250).toFixed(0)}k yrs/s`;
}

function onSlider() {
  const v = parseFloat(sliderEl.value);
  speed = v===0 ? 0 : Math.pow(10, v-1);
  // Update slider gradient
  sliderEl.style.background = `linear-gradient(to right,var(--cyan) ${v/6*100}%,rgba(95,208,230,.2) ${v/6*100}%)`;
  speedLbl.textContent = fmtSpeed(speed);
}
sliderEl.addEventListener('input', onSlider); onSlider();

pauseBtn.addEventListener('click', () => {
  paused=!paused; pauseBtn.textContent=paused?'▶ PLAY':'⏸ PAUSE';
});

let lastDateUpdate=0;
function updateDate() {
  const now=performance.now();
  if (now-lastDateUpdate<500) return; lastDateUpdate=now;
  const ms=J2000_MS+simDays*86400000;
  dateLbl.textContent=new Date(ms).toISOString().slice(0,10);
}

// ═══ PLANET INFO PANEL ═══════════════════════════════════════════════════════

const ppEl    = document.getElementById('pp');
const ppClose = document.getElementById('pp-close');
ppClose.addEventListener('click',()=>ppEl.style.display='none');

const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
const planetMeshes = planetObjs.map(o=>o.mesh);

function onTap(cx, cy) {
  ptr.x=(cx/innerWidth)*2-1; ptr.y=-(cy/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(planetMeshes);
  if (!hits.length) { ppEl.style.display='none'; return; }
  const obj = planetObjs.find(o=>o.mesh===hits[0].object);
  if (!obj) return;
  const pd=obj.pd;
  document.getElementById('pp-name').textContent=pd.name.toUpperCase();
  document.getElementById('pp-mass').textContent=pd.info.mass;
  document.getElementById('pp-dia').textContent=pd.info.dia;
  document.getElementById('pp-temp').textContent=pd.info.temp;
  document.getElementById('pp-moons').textContent=pd.moons.toString();
  document.getElementById('pp-period').textContent=pd.period;
  document.getElementById('pp-dist').textContent=`${pd.a.toFixed(3)} AU`;
  ppEl.style.display='block';
}

canvas.addEventListener('click', e=>onTap(e.clientX,e.clientY));
canvas.addEventListener('touchend', e=>{ if(e.changedTouches.length) onTap(e.changedTouches[0].clientX,e.changedTouches[0].clientY); },{passive:true});

// Double-tap to focus on planet
let lastTap=0;
canvas.addEventListener('touchend', e=>{
  const now=Date.now();
  if (now-lastTap<280 && e.changedTouches.length) {
    ptr.x=(e.changedTouches[0].clientX/innerWidth)*2-1;
    ptr.y=-(e.changedTouches[0].clientY/innerHeight)*2+1;
    ray.setFromCamera(ptr,camera);
    const hits=ray.intersectObjects(planetMeshes);
    if (hits.length) controls.target.copy(hits[0].object.position);
  }
  lastTap=now;
},{passive:true});

// ═══ PROJECT 3D → 2D ════════════════════════════════════════════════════════

const _v3=new THREE.Vector3();
function proj3D(obj) {
  obj.getWorldPosition(_v3);
  _v3.project(camera);
  return { x:(_v3.x+1)/2*innerWidth, y:(-_v3.y+1)/2*innerHeight, vis:_v3.z<1&&_v3.z>-1 };
}

function setLabel(lbl, x, y, op) {
  lbl.style.left=`${x}px`; lbl.style.top=`${y}px`; lbl.style.opacity=`${op}`;
}

// ═══ SCALE INDICATOR ═════════════════════════════════════════════════════════

const scaleLblEl = document.getElementById('scale-lbl');
function updateScale(d) {
  if (d<.08)       scaleLblEl.textContent=`ALTITUDE: ${(d*149_597_870).toLocaleString()} km`;
  else if (d<60)   scaleLblEl.textContent=`DISTANCE: ${d.toFixed(3)} AU (${(d*149.6).toFixed(0)}M km)`;
  else if (d<4000) scaleLblEl.textContent=`SCALE: ~${(d/63241).toFixed(1)} LIGHT-YEARS`;
  else             scaleLblEl.textContent=`SCALE: OBSERVABLE UNIVERSE (~46 BILLION LY)`;
}

// ═══ ANIMATION LOOP ══════════════════════════════════════════════════════════

let lastT=performance.now();
let paused_tab=false;
document.addEventListener('visibilitychange',()=>{ paused_tab=document.hidden; });

setTimeout(()=>{ document.getElementById('ldr').classList.add('gone'); setTimeout(()=>document.getElementById('ldr')?.remove(),700); },700);
setTimeout(()=>showBadge(1), 1000);

function frame() {
  requestAnimationFrame(frame);
  if (paused_tab) return;

  const now=performance.now(), dt=Math.min((now-lastT)/1000,.1); lastT=now;
  if (!paused) simDays += speed*dt;
  updateDate();

  // ── Planet positions ──
  for (const {pd,mesh} of planetObjs) {
    const p=planetXZ(pd,simDays); mesh.position.copy(p);
    mesh.rotation.y += dt*(pd.name==='Earth'?0.42:pd.name==='Jupiter'?0.55:0.3);
  }

  // ── Camera distance ──
  const camDist = camera.position.length();

  // ── Level opacities ──
  const solarOp   = levelOp(camDist, 0, 2, 55, 110);
  const galaxyOp  = levelOp(camDist, 28, 65, 2200, 4500);
  const uniOp     = levelOp(camDist, 2800, 5000, 9e9, 9e9); // stays on once entered

  // Apply to material arrays
  for (const m of solarMats) { m.opacity=solarOp; }
  solarGroup.visible = solarOp>0.01;

  for (const m of galaxyMats) { m.opacity=galaxyOp; }
  galaxyGroup.visible = galaxyOp>0.01;

  for (const m of universeMats) { m.opacity=uniOp; }
  universeGroup.visible = uniOp>0.01;

  // Background tint for universe
  if (uniOp>0) scene.background=new THREE.Color(0x05080d).lerp(new THREE.Color(0x080510),uniOp*.6);
  else         scene.background=new THREE.Color(0x05080d);

  // ── Earth detail ──
  const earthMesh = planetObjs[2].mesh;
  const earthWP   = new THREE.Vector3();
  earthMesh.getWorldPosition(earthWP);
  const dEarth = camera.position.distanceTo(earthWP);
  const edOp   = levelOp(dEarth, 0, 0.02, 0.10, 0.20);

  if (edOp>0 && camDist<3) {
    earthDetailGroup.position.copy(earthWP);
    earthDetailGroup.visible=true;
    for (const m of earthDetailMats) m.opacity=edOp;
    clouds.rotation.y += dt*.07;
    const issAngle = simDays*15.54*Math.PI*2 % (Math.PI*2);
    issMesh.position.set(Math.cos(issAngle)*.0275, Math.sin(issAngle*7)*.0025, Math.sin(issAngle)*.0275);
  } else {
    earthDetailGroup.visible=false;
  }

  // ── Level detection ──
  let lvl;
  if (dEarth<.15&&camDist<3) lvl=0;
  else if (camDist<60)       lvl=1;
  else if (camDist<4000)     lvl=2;
  else                       lvl=3;
  showBadge(lvl);

  // ── Sun rotation ──
  sun.rotation.y += dt*.18;

  // ── Planet labels ──
  const lblOp = Math.min(solarOp, 1-Math.max(0,(camDist-25)/30));
  for (let i=0;i<planetObjs.length;i++) {
    const p=proj3D(planetObjs[i].mesh);
    if (p.vis&&lblOp>.05) setLabel(planetLabels[i],p.x,p.y-8,lblOp);
    else                   planetLabels[i].style.opacity='0';
  }

  // ── Galaxy labels ──
  const gOp = galaxyOp>.25 ? galaxyOp : 0;
  galaxyLabel.style.opacity=`${gOp}`;
  youLabel.style.opacity=`${gOp}`;
  if (gOp>.0) {
    // Place galaxy label above galactic center (local 0,0,0 → world -150,0,0)
    const gc=new THREE.Vector3(-150,0,0).project(camera);
    setLabel(galaxyLabel,(gc.x+1)/2*innerWidth,(-gc.y+1)/2*innerHeight-30,gOp);
    // "You are here" marker
    const p=proj3D(youGroup);
    if (p.vis) setLabel(youLabel,p.x,p.y-14,gOp);
  }

  // ── Universe label ──
  universeLabel.style.opacity=`${uniOp}`;
  if (uniOp>.0) {
    setLabel(universeLabel,innerWidth/2,50,uniOp);
  }

  // ── Scale ──
  updateScale(camDist);

  controls.update();
  renderer.render(scene,camera);
}

frame();

// ═══ RESIZE ══════════════════════════════════════════════════════════════════

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
