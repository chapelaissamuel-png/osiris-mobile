<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>OSIRIS — Cosmic Explorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--c:#5fd0e6;--g:#ffb454;--bg:#05080d;--gl:rgba(5,8,13,.87);--br:rgba(95,208,230,.18);--f:'Courier New',monospace}
body{background:var(--bg);overflow:hidden;font-family:var(--f);color:#ccc}
canvas#c{display:block;position:fixed;inset:0;width:100%!important;height:100%!important}

/* ── HEADER ── */
#hdr{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:30;pointer-events:none;background:linear-gradient(to bottom,rgba(5,8,13,.93) 55%,transparent)}
#back-btn{pointer-events:auto;flex:0 0 auto;background:none;border:1px solid rgba(255,180,84,.38);color:var(--g);font:bold 8px/1 var(--f);letter-spacing:.2em;padding:7px 12px;text-decoration:none;text-transform:uppercase;transition:background .2s;white-space:nowrap}
#back-btn:hover{background:rgba(255,180,84,.1)}
#hdr-title{flex:1;text-align:center;font:bold 9px/1 var(--f);letter-spacing:.5em;color:var(--c);text-transform:uppercase;white-space:nowrap}
#hdr-r{flex:0 0 80px}

/* ── LEVEL NAV ── */
#lvl-nav{position:fixed;top:50px;left:50%;transform:translateX(-50%);display:flex;gap:3px;z-index:30;pointer-events:auto}
.lvb{background:rgba(5,8,13,.78);border:1px solid rgba(95,208,230,.17);color:rgba(95,208,230,.42);font:7px/1 var(--f);letter-spacing:.14em;padding:5px 8px;cursor:pointer;transition:all .22s;text-transform:uppercase;white-space:nowrap}
.lvb:hover{border-color:rgba(95,208,230,.4);color:rgba(95,208,230,.78);background:rgba(95,208,230,.05)}
.lvb.on{border-color:var(--c);color:var(--c);background:rgba(95,208,230,.11);box-shadow:0 0 9px rgba(95,208,230,.13)}
.lvb.zod{border-color:rgba(255,180,84,.28);color:rgba(255,180,84,.55)}
.lvb.zod.on{border-color:var(--g);color:var(--g);background:rgba(255,180,84,.1);box-shadow:0 0 9px rgba(255,180,84,.12)}
@media(max-width:520px){.lvb{padding:4px 5px;font-size:6px;letter-spacing:.06em}}

/* ── CONTROLS ── */
#ctrl{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--gl);border:1px solid var(--br);padding:8px 14px;pointer-events:auto;font:7px/1 var(--f);letter-spacing:.1em;z-index:20}
.cl{color:rgba(95,208,230,.5);text-transform:uppercase}
#spd{width:85px;cursor:pointer;-webkit-appearance:none;height:2px;background:linear-gradient(to right,var(--c) 33%,rgba(95,208,230,.2) 33%);outline:none;border:none}
#spd::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;border-radius:50%;background:var(--c);cursor:pointer}
#spd-lbl{color:var(--c);min-width:68px}
#date-disp{color:rgba(255,255,255,.3);font-size:7px}
.sep{color:rgba(95,208,230,.2)}
.cbtn{background:none;border:1px solid rgba(95,208,230,.27);color:var(--c);padding:3px 8px;cursor:pointer;font:7px/1 var(--f);letter-spacing:.07em;transition:background .18s}
.cbtn:hover{background:rgba(95,208,230,.06)}
#date-in{background:rgba(5,8,13,.6);border:1px solid rgba(95,208,230,.22);color:var(--c);font:7px/1 var(--f);letter-spacing:.08em;padding:3px 6px;cursor:pointer;color-scheme:dark}
#date-in::-webkit-calendar-picker-indicator{opacity:.4;cursor:pointer;filter:invert(1) sepia(1) saturate(3) hue-rotate(150deg)}
#snd{border-color:rgba(255,180,84,.28);color:rgba(255,180,84,.55)}
#snd.on{border-color:var(--g);color:var(--g);box-shadow:0 0 6px rgba(255,180,84,.14)}

/* ── SCALE ── */
#scl{position:fixed;bottom:58px;left:50%;transform:translateX(-50%);font:7px/1 var(--f);letter-spacing:.16em;color:rgba(95,208,230,.35);pointer-events:none;white-space:nowrap;z-index:20;text-align:center}

/* ── PLANET PANEL ── */
#pp{position:fixed;right:14px;top:50%;transform:translateY(-50%);background:var(--gl);border:1px solid var(--g);padding:14px 15px;min-width:196px;pointer-events:auto;display:none;z-index:25}
@media(max-width:540px){#pp{right:8px;left:8px;top:auto;bottom:70px;transform:none;min-width:0}}
#pp h3{color:var(--g);font:bold 10px/1 var(--f);letter-spacing:.3em;margin-bottom:10px;text-transform:uppercase}
.pr{display:flex;justify-content:space-between;gap:10px;margin:4px 0;font-size:7px;color:rgba(255,255,255,.42)}
.pv{color:var(--c);text-align:right;flex-shrink:0}
.pv.zod{color:rgba(255,180,84,.85);font-size:8px}
#ppc{position:absolute;top:7px;right:9px;cursor:pointer;color:var(--g);font-size:13px;background:none;border:none}

/* ── ZODIAC PANEL ── */
#zpanel{position:fixed;right:14px;top:50%;transform:translateY(-50%);background:var(--gl);border:1px solid var(--g);padding:12px 14px;z-index:25;display:none;min-width:286px}
#zpanel.vis{display:block}
@media(max-width:580px){#zpanel{right:4px;left:4px;top:auto;bottom:70px;transform:none;min-width:0}}
#zpanel h4{color:var(--g);font:bold 8px/1 var(--f);letter-spacing:.35em;text-align:center;margin-bottom:8px;text-transform:uppercase}
#zdate{color:rgba(95,208,230,.7)}
#zc{display:block;margin:0 auto}
#zlegend{margin-top:7px;font:6px/1.8 var(--f);letter-spacing:.08em;color:rgba(255,255,255,.35);text-align:center;white-space:nowrap}
#zpclose{position:absolute;top:7px;right:9px;cursor:pointer;color:var(--g);font-size:13px;background:none;border:none}

/* ── LABELS ── */
#lbls{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.lbl{position:absolute;font:7px/1 var(--f);letter-spacing:.2em;color:rgba(95,208,230,.82);text-transform:uppercase;white-space:nowrap;transform:translate(-50%,-100%);pointer-events:none;padding-bottom:4px;transition:opacity .22s;text-shadow:0 0 7px rgba(95,208,230,.42)}
.lbl::after{content:'';display:block;width:3px;height:3px;border-radius:50%;background:var(--c);margin:2px auto 0;box-shadow:0 0 4px var(--c)}
.lbl.gx{font-size:11px;letter-spacing:.45em;color:rgba(255,180,84,.85);text-shadow:0 0 9px rgba(255,180,84,.38)}
.lbl.gx::after{background:var(--g);box-shadow:0 0 5px var(--g)}
.lbl.you{font-size:8px;color:rgba(95,208,230,.95);animation:pulse 2s ease-in-out infinite}
.lbl.zod{font-size:7px;color:rgba(255,180,84,.65);letter-spacing:.12em}
.lbl.zod::after{background:var(--g);box-shadow:0 0 3px var(--g)}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ── FLASH ── */
#flash{position:fixed;inset:0;pointer-events:none;z-index:50;background:rgba(5,8,13,0);transition:background .28s}
#flash.on{background:rgba(5,8,13,.72)}

/* ── LOADING ── */
#ldr{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .7s}
#ldr.gone{opacity:0;pointer-events:none}
.spin{width:34px;height:34px;border:2px solid rgba(95,208,230,.12);border-top-color:var(--c);border-radius:50%;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#ldr p{font:8px/1 var(--f);letter-spacing:.35em;color:var(--c)}
#thint{position:fixed;bottom:58px;right:14px;font:7px/1.9 var(--f);letter-spacing:.07em;color:rgba(255,255,255,.13);pointer-events:none;text-align:right;z-index:20}
@media(min-width:768px){#thint{display:none}}
</style>

</head>
<body>
<div id="ldr"><div class="spin"></div><p>OSIRIS COSMIC EXPLORER — LOADING…</p></div>

  <span class="sep">|</span>

<div id="pp">

<div id="zpanel">

  <h4>THÈME ASTRAL — <span id="zdate"></span></h4>
  <canvas id="zc" width="258" height="258"></canvas>
  <div id="zlegend"></div>
</div>

<div id="scl"></div>
<div id="lbls"></div>
<div id="thint">PINCH → ZOOM<br>DRAG → ORBIT<br>TAP → INFO</div>

<script type="module">

function gTex(r,g,b,sz=128){

}

const zcCanvas=document.getElementById('zc');
const zctx=zcCanvas.getContext('2d');
const ZW=zcCanvas.width,ZH=zcCanvas.height,ZCX=ZW/2,ZCY=ZH/2,ZR=ZW/2-6;
function drawZChart(){
  zctx.clearRect(0,0,ZW,ZH);
  zctx.fillStyle='#05080d';zctx.fillRect(0,0,ZW,ZH);
  // Sectors
  for(let i=0;i<12;i++){
    const a0=-(i/12)*Math.PI*2,a1=-((i+1)/12)*Math.PI*2;
    zctx.beginPath();zctx.moveTo(ZCX,ZCY);zctx.arc(ZCX,ZCY,ZR*.93,a0,a1,true);zctx.closePath();
    zctx.fillStyle=ZEC[ZE[i]];zctx.fill();
    zctx.strokeStyle='rgba(95,208,230,.18)';zctx.lineWidth=.8;zctx.stroke();
    // Division line
    zctx.beginPath();zctx.moveTo(ZCX+Math.cos(a0)*ZR*.52,ZCY+Math.sin(a0)*ZR*.52);zctx.lineTo(ZCX+Math.cos(a0)*ZR*.93,ZCY+Math.sin(a0)*ZR*.93);
    zctx.strokeStyle='rgba(95,208,230,.25)';zctx.lineWidth=.8;zctx.stroke();
    // Symbol
    const am=-(i+.5)/12*Math.PI*2;
    zctx.fillStyle='rgba(95,208,230,.82)';zctx.font='bold 13px Courier New';zctx.textAlign='center';zctx.textBaseline='middle';
    zctx.fillText(ZS[i],ZCX+Math.cos(am)*ZR*.71,ZCY+Math.sin(am)*ZR*.71);
    zctx.fillStyle='rgba(95,208,230,.38)';zctx.font='6px Courier New';
    zctx.fillText(ZN[i].slice(0,3).toUpperCase(),ZCX+Math.cos(am)*ZR*.85,ZCY+Math.sin(am)*ZR*.85);
  }
  // Rings
  zctx.beginPath();zctx.arc(ZCX,ZCY,ZR*.93,0,Math.PI*2);zctx.strokeStyle='rgba(95,208,230,.3)';zctx.lineWidth=1;zctx.stroke();
  zctx.beginPath();zctx.arc(ZCX,ZCY,ZR*.52,0,Math.PI*2);zctx.strokeStyle='rgba(95,208,230,.14)';zctx.stroke();
  // Sun center
  zctx.beginPath();zctx.arc(ZCX,ZCY,ZR*.11,0,Math.PI*2);
  zctx.fillStyle='rgba(255,210,60,.18)';zctx.fill();zctx.strokeStyle='rgba(255,180,84,.45)';zctx.lineWidth=1;zctx.stroke();
  zctx.fillStyle='rgba(255,230,80,.9)';zctx.font='13px serif';zctx.textAlign='center';zctx.textBaseline='middle';zctx.fillText('☉',ZCX,ZCY);
  // Planet + Moon + Sun dots
  const earthLon=eclLon(pO[2].mesh.position);
  const sunLon=(earthLon+180)%360;
  const bodies=[
    ...pO.map((o,i)=>({lon:eclLon(o.mesh.position),sym:PSYM[i],c:'#'+o.pd.c.toString(16).padStart(6,'0')})),
    {lon:eclLon(mO[0].mesh.position),sym:'☽',c:'#aaaaaa'},
    {lon:sunLon,sym:'☉',c:'#ffdd22'},
  ];
  bodies.forEach(({lon,sym,c})=>{
    const ang=-(lon*Math.PI/180);
    const px=ZCX+Math.cos(ang)*ZR*.62, py=ZCY+Math.sin(ang)*ZR*.62;
    // Radial tick
    zctx.beginPath();zctx.moveTo(ZCX+Math.cos(ang)*ZR*.52,ZCY+Math.sin(ang)*ZR*.52);zctx.lineTo(ZCX+Math.cos(ang)*ZR*.93,ZCY+Math.sin(ang)*ZR*.93);
    zctx.strokeStyle=c+'55';zctx.lineWidth=.5;zctx.stroke();
    // Dot
    zctx.beginPath();zctx.arc(px,py,5,0,Math.PI*2);zctx.fillStyle=c;zctx.fill();
    zctx.fillStyle='rgba(5,8,13,.8)';zctx.font='bold 6px sans-serif';zctx.textAlign='center';zctx.textBaseline='middle';zctx.fillText(sym,px,py);
  });
  // Update header date
  document.getElementById('zdate').textContent=new Date(J2000+simDays*86400000).toISOString().slice(0,10);
  // Legend
  const earthSign=zodStr(earthLon);const sunSign=zodStr(sunLon);
  document.getElementById('zlegend').textContent=`☉ Sun: ${sunSign.trim()}   ⊕ Earth: ${earthSign.trim()}`;
}

// ═══ LABEL HELPERS
const _v=new THREE.Vector3();
function proj(o){o.getWorldPosition(_v);_v.project(cam);return{x:(_v.x+1)/2*innerWidth,y:(-_v.y+1)/2*innerHeight,vis:_v.z<1&&_v.z>-1};}
function setL(l,x,y,op){l.style.left=`${x}px`;l.style.top=`${y}px`;l.style.opacity=op;}
const sclEl=document.getElementById('scl');
function updScl(d){
  if(d<.08)sclEl.textContent=`ALTITUDE ≈ ${(d*149597870).toLocaleString()} km`;
  else if(d<60)sclEl.textContent=`SCALE: ${d.toFixed(3)} AU  |  ${(d*149.6).toFixed(0)}M km`;
  else if(d<4000)sclEl.textContent=`SCALE: ~${(d/63241).toFixed(1)} light-years`;
  else sclEl.textContent=`SCALE: Observable Universe (~46 billion ly)`;
}

// ═══ ANIMATION LOOP
let lastT=performance.now(),fn=0,hidden=false;
document.addEventListener('visibilitychange',()=>{hidden=document.hidden;});
setTimeout(()=>{document.getElementById('ldr').classList.add('gone');setTimeout(()=>document.getElementById('ldr')?.remove(),750);},900);

function loop(){
  requestAnimationFrame(loop);
  if(hidden)return;
  const now=performance.now(),dt=Math.min((now-lastT)/1000,.1);lastT=now;fn++;

  // Time
  if(!paused)simDays+=speed*dt;
  if(fn%45===0){
    dateLbl.textContent=new Date(J2000+simDays*86400000).toISOString().slice(0,10);
    syncDateIn();
  }

  // Fly-to
  if(fly){
    const t=Math.min((now-flyT0)/flyDur,1),e=eio(t);
    cam.position.lerpVectors(fp0,fp1,e);ctrl.target.lerpVectors(ft0,ft1,e);
    if(t>=1){fly=false;ctrl.enabled=true;}
  }

  const cd=cam.position.length();

  // Planets + trails
  for(let i=0;i<pO.length;i++){
    const{pd,mesh,tm,tpa}=pO[i];
    mesh.position.copy(pPos(pd,simDays));
    mesh.rotation.y+=dt*(pd.n==='Jupiter'?.55:pd.n==='Earth'?.42:.27);
    if(fn%4===0){for(let j=0;j<TRAIL_N;j++){const p=pPos(pd,simDays-pd.T*.28*(1-j/(TRAIL_N-1)));tpa.array[j*3]=p.x;tpa.array[j*3+1]=p.y;tpa.array[j*3+2]=p.z;}tpa.needsUpdate=true;}
  }

  // Moons
  for(const{md,mesh}of mO){
    const par=pO[md.pi].mesh,a=(simDays/md.T)*Math.PI*2;
    mesh.position.set(par.position.x+md.a*Math.cos(a),par.position.y+md.a*.12*Math.sin(a*1.3),par.position.z+md.a*Math.sin(a));
  }

  // Comet
  const cp=pPos(COMET,simDays);cometComa.position.copy(cp);
  const ctL=Math.min(4.5/(cp.length()+.05),3.8),iD=cp.clone().normalize();
  const dD=iD.clone().addScaledVector(new THREE.Vector3(0,1,0).cross(iD).normalize(),.28).normalize();
  for(let i=0;i<44;i++){const f=i/43;cTP.array[i*3]=cp.x+iD.x*f*ctL;cTP.array[i*3+1]=cp.y+iD.y*f*ctL;cTP.array[i*3+2]=cp.z+iD.z*f*ctL;}
  for(let i=0;i<28;i++){const f=i/27;cDP.array[i*3]=cp.x+dD.x*f*ctL*.65;cDP.array[i*3+1]=cp.y+dD.y*f*ctL*.65;cDP.array[i*3+2]=cp.z+dD.z*f*ctL*.65;}
  cTP.needsUpdate=true;cDP.needsUpdate=true;

  // BUG 2/3 FIX: non-overlapping thresholds
  // Solar: full 0-55 AU, fades 55-88 AU
  // Galaxy: fades in 88-125 AU (no overlap with solar!)
  const sOp=lo(cd,0,2,55,88), gOp=lo(cd,88,125,2200,4500), uOp=lo(cd,2800,5000,9e9,9e9);

  for(const m of sM)m.opacity=sOp;
  for(const m of galM)m.opacity=gOp;
  for(const m of uniM)m.opacity=uOp;
  sG.visible=sOp>.004;
  galG.visible=gOp>.004;
  uniG.visible=uOp>.004;

  // Trail opacity (slightly stronger than base solar)
  for(const{tm}of pO)tm.opacity=Math.min(sOp*.5,.46);
  cometComa.material.opacity=sOp*.78;
  cTM.opacity=Math.min(sOp*.62,.56);
  cDM.opacity=Math.min(sOp*.32,.26);

  // Zodiac ring
  zodG.visible=zodOn&&sOp>.05;
  if(zodG.visible){for(const m of zodM)m.opacity=sOp*(.12+Math.random()*.0);}

  // Background tint
  if(uOp>0)scene.background=new THREE.Color(0x05080d).lerp(new THREE.Color(0x060410),uOp*.7);
  else scene.background=new THREE.Color(0x05080d);

  // Earth close-up
  const ewp=new THREE.Vector3();pO[2].mesh.getWorldPosition(ewp);
  const de=cam.position.distanceTo(ewp);
  const edOp=lo(de,0,.02,.12,.22);
  if(edOp>0&&cd<3){
    edG.position.copy(ewp);edG.visible=true;
    for(const m of edM)m.opacity=edOp;
    clouds.rotation.y+=dt*.07;
    const ia=simDays*15.54*Math.PI*2%(Math.PI*2);
    iss.position.set(Math.cos(ia)*.027,Math.sin(ia*7)*.0022,Math.sin(ia)*.027);
    const ma=(simDays/27.32)*Math.PI*2;moonD.position.set(Math.cos(ma)*.055,0,Math.sin(ma)*.055);
  }else edG.visible=false;

  // Sun corona pulse
  const T=now*.001;
  SUNGL[0].scale.set(1.3*(1+Math.sin(T*.7)*.06),1.3*(1+Math.sin(T*.7)*.06),1);
  SUNGL[1].scale.set(3.2*(1+Math.sin(T*.45)*.05),3.2*(1+Math.sin(T*.45)*.05),1);
  SUNGL[2].scale.set(7.0*(1+Math.sin(T*.3)*.04),7.0*(1+Math.sin(T*.3)*.04),1);
  SUNGL[3].scale.set(13*(1+Math.sin(T*.18)*.03),13*(1+Math.sin(T*.18)*.03),1);
  sun.rotation.y+=dt*.18;

  // Level detection (BUG 2 FIX: updated thresholds match new sOp/gOp)
  if(!fly){
    let lv;if(de<.15&&cd<3)lv=0;else if(cd<88)lv=1;else if(cd<2800)lv=2;else lv=3;
    if(lv!==curLvl&&!zodOn)setLvl(lv);
    else if(!zodOn)lvBtns.forEach((b,i)=>b.classList.toggle('on',i===lv));
  }

  // Planet labels with overlap resolution
  const lOp=Math.min(sOp,1-Math.max(0,(cd-25)/38));
  const lItems=[];
  for(let i=0;i<pO.length;i++){
    const p=proj(pO[i].mesh);
    if(p.vis&&lOp>.04)lItems.push({lbl:pLbl[i],x:p.x,y:p.y-9,op:lOp});
    else pLbl[i].style.opacity='0';
  }
  resolveOvlp(lItems);
  for(const{lbl,x,y,op}of lItems)setL(lbl,x,y,op);

  // Zodiac ring labels
  if(zodG.visible){
    zodLO.forEach((obj,i)=>{
      const p=proj(obj);
      if(p.vis)setL(zodLbl[i],p.x,p.y,Math.min(sOp*.8,.65));
      else zodLbl[i].style.opacity='0';
    });
  }else zodLbl.forEach(l=>l.style.opacity='0');

  // Galaxy labels
  const gl=gOp>.25?gOp:0;galLbl.style.opacity=gl;youLbl.style.opacity=gl;
  if(gl>.01){
    const gc=new THREE.Vector3(-150,0,0).project(cam);
    setL(galLbl,(gc.x+1)/2*innerWidth,(-gc.y+1)/2*innerHeight-32,gl);
    const yp=proj(youG);if(yp.vis)setL(youLbl,yp.x,yp.y-14,gl);
  }
  uniLbl.style.opacity=uOp;if(uOp>.01)setL(uniLbl,innerWidth/2,72,uOp);

  if(fn%10===0)updScl(cd);

  // Zodiac chart redraw
  if(zodOn)drawZChart();

  ctrl.update();
  renderer.render(scene,cam);
}
loop();

window.addEventListener('resize',()=>{
  cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
